<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中村達希</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="リンクを踏んで、ここに来てくださったこと。それが、何より大切です。">
  <style>
    :root { color-scheme: light; --paper: #F7F3EC; --ink: #1C1915; --quiet: #6B5E4E; --rule: #E3DCD0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--paper); color: var(--ink); font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; line-height: 1.9; }
    .skip { position: absolute; left: 1rem; top: 0; transform: translateY(-120%); background: var(--ink); color: var(--paper); font-family: system-ui, sans-serif; text-decoration: none; padding: 0.4rem 0.7rem; }
    .skip:focus { transform: none; }
    main { max-width: 36rem; margin: 0 auto; padding: 4.5rem 1.5rem 5rem; }
    .name { font-family: system-ui, sans-serif; font-size: 0.85rem; color: var(--quiet); letter-spacing: 0.06em; margin-bottom: 2rem; }
    h1 { font-size: 1.35rem; font-weight: 500; line-height: 1.8; margin-bottom: 3.5rem; }
    nav { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
    nav a { display: flex; flex-direction: column; gap: 0.15rem; padding: 1.1rem 0; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; min-height: 44px; }
    nav a:hover strong { text-decoration: underline; text-underline-offset: 0.25em; }
    nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    nav strong { font-family: system-ui, sans-serif; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.06em; }
    nav span { color: var(--quiet); font-size: 0.98rem; }
    .draft { margin-top: 3rem; color: var(--quiet); font-family: system-ui, sans-serif; font-size: 0.85rem; }
  </style>
</head>
<body>
  <a class="skip" href="#content">本文へ進む</a>
  <main id="content">
    <p class="name">中村達希</p>
    <h1>リンクを踏んで、ここに来てくださったこと。<br>それが、何より大切です。</h1>
    <nav aria-label="二つの入口">
      <a href="portal/">
        <strong>研究サイト</strong>
        <span>なぜ助けを求められなかったのか。<br>その理由を、人の心に戻さず、仕組みから考える。</span>
      </a>
      <a href="life/">
        <strong>日常</strong>
        <span>なにげない一日を、ここに置く。<br>研究のモデルには、しない。</span>
      </a>
    </nav>
    <p class="draft">確認用です。本番のドメインは変えていません。</p>
  </main>
</body>
</html>
