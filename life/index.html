<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中村達希の記録</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="なにげない一日を、ここに置く。研究のモデルには、しない。">
  <style>
    :root {
      color-scheme: light;
      --paper: #F7F3EC;
      --ink: #1C1915;
      --date: #6B5E4E;
      --rule: #E3DCD0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
      line-height: 1.9;
      letter-spacing: 0.03em;
      -webkit-font-smoothing: antialiased;
    }
    /* 約36文字が自然に収まる手帳の紙幅 */
    .notebook {
      max-width: 36rem;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }
    /* 1. 欄外 */
    .margin-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.85rem;
      color: var(--date);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.6rem;
      margin-bottom: 3rem;
      font-family: system-ui, sans-serif;
    }
    /* 2. 最初の一文 */
    .lead {
      font-size: 1.05rem;
      margin-bottom: 3.5rem;
    }
    /* 3. これからの見出し（箱にせず、線だけの項目） */
    .sections-index {
      display: flex;
      gap: 1.5rem;
      list-style: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.75rem;
      margin-bottom: 3.5rem;
      font-size: 0.95rem;
      color: var(--date);
      font-family: system-ui, sans-serif;
    }
    .sections-index li {
      position: relative;
    }
    .sections-index li + li::before {
      content: "/";
      margin-right: 1.5rem;
      color: var(--rule);
    }
    /* 4. あとから足す文章（左に日付、右に文章。1件が1段） */
    .records-list {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      margin-bottom: 5rem;
    }
    .record-entry {
      display: grid;
      grid-template-columns: 7.5rem 1fr;
      column-gap: 1.5rem;
      align-items: baseline;
    }
    .record-date {
      color: var(--date);
      font-size: 0.88rem;
      font-family: ui-monospace, SFMono-Regular, monospace;
      white-space: nowrap;
    }
    .record-body {
      font-size: 0.98rem;
    }
    .record-body p + p {
      margin-top: 0.8rem;
    }
    /* 5. いちばん下の一行と文字リンク */
    .footer-boundary {
      border-top: 1px solid var(--rule);
      padding-top: 2rem;
      font-size: 0.88rem;
    }
    .footer-lead {
      color: var(--date);
      margin-bottom: 1rem;
    }
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      list-style: none;
    }
    .footer-links a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: var(--rule);
      transition: text-decoration-color 0.2s;
    }
    .footer-links a:hover {
      text-decoration-color: var(--ink);
    }
    .footer-links a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }
    /* モバイル表示時の日付と文章の並び */
    @media (max-width: 480px) {
      .record-entry {
        grid-template-columns: 1fr;
        row-gap: 0.3rem;
      }
    }
  </style>
</head>
<body>
  <main class="notebook">
    <!-- 1. 欄外 -->
    <header class="margin-header">
      <span>中村達希の記録</span>
      <span>研究とは別</span>
    </header>
    <!-- 2. 最初の一文 -->
    <p class="lead">なにげない一日を、ここに置く。<br>研究のモデルには、しない。</p>
    <!-- 3. これからの見出し（線だけの項目） -->
    <ul class="sections-index">
      <li>いま</li>
      <li>これまで</li>
      <li>書いておきたいこと</li>
    </ul>
    <!-- 4. あとから足す文章（中身はこれから本人が書く場所） -->
    <div class="records-list">
      <!-- 
      文章を足すときは、この1段（record-entry）を上または下に増やしていきます。
      写真の枠もボタンもありません。
      <article class="record-entry">
        <time class="record-date">2026-11-04</time>
        <div class="record-body">
          <p>ここに文章が入ります。</p>
        </div>
      </article>
      -->
    </div>
    <!-- 5. いちばん下の一行 -->
    <footer class="footer-boundary">
      <p class="footer-lead"><a href="../">入口</a>から分かれた、日常のページです。</p>
      <ul class="footer-links">
        <li><a href="../portal/">研究サイト</a></li>
        <li><a href="https://note.com/tatsu97910">note</a></li>
        <li><a href="https://x.com/tatsu97910">X</a></li>
        <li><a href="https://orcid.org/0009-0004-9696-7896">ORCID</a></li>
      </ul>
    </footer>
  </main>
</body>
</html>
