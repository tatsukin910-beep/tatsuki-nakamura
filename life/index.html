<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中村達希の記録</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="中村達希の日常を置く場所です。研究のモデルではありません。">
  <style>
    :root {
      color-scheme: light;
      --paper: #F7F3EC;
      --ink: #1C1915;
      --date: #6B5E4E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
      font-size: 1.125rem;
      line-height: 1.9;
    }
    a { color: var(--ink); text-underline-offset: 0.25em; }
    a:hover { color: var(--date); }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .skip {
      position: absolute;
      left: 1rem;
      top: 0;
      transform: translateY(-120%);
      background: var(--ink);
      color: var(--paper);
      padding: 0.5rem 0.8rem;
      text-decoration: none;
    }
    .skip:focus { transform: none; }
    main {
      max-width: 36em;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    .running {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 2.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }
    .running p { margin: 0; }
    h1 {
      margin: 0 0 2.75rem;
      font-family: Georgia, "Noto Serif JP", serif;
      font-size: 1.35rem;
      font-weight: 500;
      line-height: 1.7;
    }
    h2 {
      margin: 0;
      padding: 0.85rem 0;
      border-top: 1px solid var(--date);
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }
    .chapters { margin: 0 0 3rem; }
    .chapters h2:last-child { border-bottom: 1px solid var(--date); }
    .entry {
      display: grid;
      grid-template-columns: 7rem 1fr;
      gap: 0.75rem 1rem;
      padding: 1rem 0;
      border-top: 1px solid rgba(107, 94, 78, 0.35);
    }
    .entry time {
      color: var(--date);
      font-variant-numeric: tabular-nums;
    }
    .entry p { margin: 0; }
    footer {
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--date);
      font-size: 1rem;
    }
    footer p { margin: 0 0 0.8rem; }
    footer ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    footer li { margin: 0.15rem 0; }
    .draft {
      margin-top: 2rem;
      color: var(--date);
      font-size: 0.9rem;
    }
    @media (max-width: 640px) {
      .entry { grid-template-columns: 1fr; gap: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">本文へ進む</a>
  <main id="content">
    <header class="running">
      <p>中村達希の記録</p>
      <p>研究とは別</p>
    </header>
    <h1>日常を置く場所です。研究のモデルではありません。</h1>
    <div class="chapters" aria-label="これからの見出し">
      <h2>いま</h2>
      <h2>これまで</h2>
      <h2>書いておきたいこと</h2>
    </div>
    <footer>
      <p><a href="https://tatsuki-nakamura.com/">構造の話は、研究サイトにあります。</a></p>
      <ul>
        <li><a href="https://note.com/tatsu97910">note</a></li>
        <li><a href="https://x.com/tatsu97910">X</a></li>
        <li><a href="https://orcid.org/0009-0004-9696-7896">ORCID</a></li>
      </ul>
      <p class="draft">確認用のページです。中身は、これから置きます。</p>
    </footer>
  </main>
</body>
</html>
